name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Microservices
        run: |
          SERVICES=("eureka-server" "api-gateway" "auth-service" "project-service" "payment-service" "file-service" "admin-server" "collab-service" "comment-service" "execution-service" "notification-service" "version-service")
          for SERVICE in "${SERVICES[@]}"; do
            echo "Building $SERVICE..."
            docker build --build-arg SERVICE_NAME=$SERVICE -t ${{ secrets.DOCKERHUB_USERNAME }}/codesync-$SERVICE:latest -f Dockerfile .
            echo "Pushing $SERVICE..."
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/codesync-$SERVICE:latest
          done

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_EC2_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # Ensure the directory exists
            mkdir -p ~/CODE-COLLAB/backend
            cd ~/CODE-COLLAB/backend
            
            # Recreate .env file completely from GitHub Secrets (The Right Way)
            cat << 'EOF' > .env
            DB_URL=jdbc:postgresql://postgres:5432/codesync
            DB_URL_AUTH=jdbc:postgresql://postgres:5432/codesync
            DB_USERNAME=postgres
            DB_PASSWORD=postgres
            SPRING_DATA_REDIS_HOST=redis
            SPRING_DATA_REDIS_PORT=6379
            REDIS_HOST=redis
            REDIS_PORT=6379
            SPRING_RABBITMQ_HOST=rabbitmq
            JWT_SECRET=bXlfc3VwZXJfc2VjcmV0X2tleV9mb3Jfand0X3Rva2VuX2dlbmVyYXRpb24=
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GITHUB_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}
            GITHUB_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}
            RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
            RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
            FRONTEND_URL=http://13.237.228.156
            OAUTH2_REDIRECT_BASE_URI=http://13.237.228.156:8080
            EOF
            
            # Pull the production docker-compose file from GitHub
            curl -o docker-compose.yml https://raw.githubusercontent.com/wasim-akaram/Code-Collab-Backend/main/docker-compose.prod.yml
            
            # Pull latest images and restart containers
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            docker compose pull
            docker compose up -d
