server:
  port: 8084

spring:
  application:
    name: collab-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /sessions/v3/api-docs
  swagger-ui:
    path: /sessions/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: "*"

