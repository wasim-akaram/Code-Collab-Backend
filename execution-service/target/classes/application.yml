server:
  port: 8086

spring:
  application:
    name: execution-service
  datasource:
    url: jdbc:postgresql://localhost:5432/projectdb
    username: postgres
    password: Wasim123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /executions/v3/api-docs
  swagger-ui:
    path: /executions/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
